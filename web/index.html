<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AdamDrop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AdamDrop</title>
<link rel="icon" href="/logo-small.png">
<link rel="apple-touch-icon" href="/logo-small.png">
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --sub: #6e6e73;
    --accent: #c98a15; --accent2: #0a84ff; --ok: #30b95a; --err: #ff453a; --line: #e5e5ea; --track: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0d; --card: #1c1c1e; --text: #f2efe6; --sub: #98989f; --line: #2c2c2e; --track: #3a3a3c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px); max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin: 12px 0 22px; position: relative; }
  .applogo { width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 12px; display: block;
    background: #111; border: 1px solid rgba(216,155,43,.4); box-shadow: 0 8px 22px rgba(216,155,43,.30); }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--sub); font-size: 14px; }
  .lang { position: absolute; right: 0; top: 0; display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--line); }
  .lang button { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .lang button.on { background: var(--accent); color: #14110a; }
  .pick { display: block; width: 100%; border: 0; border-radius: 16px; background: linear-gradient(140deg, #e9b452, #d89b2b); color: #14110a;
    font-size: 18px; font-weight: 700; padding: 18px; text-align: center; cursor: pointer; box-shadow: 0 8px 20px rgba(216,155,43,.28); }
  .pick:active { opacity: .85; }
  .pick.secondary { background: var(--card); color: var(--accent); margin-top: 10px; font-size: 16px; padding: 14px; box-shadow: none; border: 1px solid var(--line); }
  .pick[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  input[type=file] { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-top: 16px; }
  .overall { display: none; }
  .overall .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; }
  .overall .row span:last-child { color: var(--sub); font-weight: 500; font-size: 13px; white-space: nowrap; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .15s linear; }
  .bar.done i { background: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  li:first-child { border-top: 0; }
  li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .s { color: var(--sub); font-size: 12px; white-space: nowrap; }
  li .st { width: 22px; text-align: center; font-weight: 700; }
  li.ok .st { color: var(--ok); } li.err .st { color: var(--err); } li.run .st { color: var(--accent); }
  li .note { display: block; color: var(--accent); font-size: 11px; }
  .tip { font-size: 13px; color: var(--sub); line-height: 1.5; }
  .tip b { color: var(--text); }
  .tip a { color: var(--accent); word-break: break-all; }
  #list:empty { display: none; }
  details summary { font-weight: 600; font-size: 15px; cursor: pointer; color: var(--accent); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details ol { padding-left: 20px; margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--text); }
  details ol li { display: list-item; border: 0; padding: 3px 0; font-size: 14px; }
  .copy { display: flex; gap: 8px; margin: 8px 0 4px; }
  .copy input { flex: 1; min-width: 0; font: 12px ui-monospace, Menlo, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .copy button { border: 0; border-radius: 10px; background: var(--accent); color: #14110a; font-size: 14px; font-weight: 700; padding: 0 14px; }
  a.dl { display: block; text-align: center; text-decoration: none; background: var(--accent); color: #14110a; font-size: 15px; font-weight: 700; padding: 12px; border-radius: 12px; }
  a.dl2 { background: transparent; color: var(--accent); border: 1px solid rgba(216,155,43,.55); font-weight: 600; font-size: 14px; padding: 10px; }
  .mini { color: var(--sub); font-size: 12px; margin-top: 6px; line-height: 1.45; }
  .modes { display:flex;gap:8px;margin-bottom:20px; }
  .modes button {flex:1;padding:12px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:14px;}
  .modes button.on {border-color:var(--accent);background:var(--accent);color:#14110a;font-weight:700;}
  .receive-file {padding:16px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere;}
  .receive-actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .receive-actions a {flex:1;min-width:120px;}
  .gimg { display: block; width: 100%; margin: 8px 0 0; border-radius: 9px; border: 1px solid var(--line); }
  .rctl { display: flex; gap: 8px; flex-wrap: wrap; }
  .rctl .pick { flex: 1; min-width: 140px; }
  /* Khung xem anh/video ngay trong trang: de nguoi dung NHAN GIU vao anh -> Luu vao Anh.
     Mo o tab moi thi Safari tren iOS de day tep vao Tep (nhat la khi phan hoi co CSP sandbox). */
  #viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; padding: 14px; }
  #viewer[hidden] { display: none; }
  .vbox { width: 100%; max-width: 620px; max-height: 100%; overflow: auto; background: var(--card); border-radius: 16px; padding: 14px; }
  .vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .vhead strong { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
  .vhead button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13px; }
  #vBody img, #vBody video { display: block; width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 10px; background: #000; }
  #viewer .tip { margin: 10px 0; }
</style>
</head>
<body>
<header>
  <div class="lang">
    <button id="langEn" data-lang="en">EN</button>
    <button id="langVi" data-lang="vi">VI</button>
  </div>
  <img class="applogo" src="/logo-small.png" alt="AdamDrop">
  <h1 id="h1"></h1>
  <div class="sub" id="status"></div>
</header>

<nav class="modes"><button id="modeSend" type="button"></button><button id="modeReceive" type="button"></button></nav>
<section id="receivePane" hidden><h2 id="receiveTitle"></h2><div class="rctl"><button class="pick secondary" id="refreshShares"></button><button class="pick secondary" id="saveAllFiles"></button></div><p id="receiveStatus" class="tip" role="status"></p><div id="receiveQueue"></div><p id="photosHelp" class="tip"></p>
  <details id="rcvSc"><summary id="rcvScSummary"></summary><ol id="rcvScSteps"></ol></details>
</section>
<div id="viewer" hidden role="dialog" aria-modal="true">
  <div class="vbox">
    <div class="vhead"><strong id="vTitle"></strong><button type="button" id="vClose"></button></div>
    <div id="vBody"></div>
    <p class="tip" id="vHelp"></p>
    <a class="dl dl2" id="vOpen" target="_blank" rel="noopener noreferrer"></a>
  </div>
</div>
<section id="sendPane">
<label class="pick" id="pickPhotos" for="filePhotos"></label>
<input type="file" id="filePhotos" accept="image/*,video/*" multiple>
<label class="pick secondary" id="pickFiles" for="fileAny"></label>
<input type="file" id="fileAny" multiple>

<div class="card overall" id="overall">
  <div class="row"><span id="ovText"></span><span id="ovSub"></span></div>
  <div class="bar" id="ovBar"><i></i></div>
</div>

<div class="card" id="listCard" style="display:none"><ul id="list"></ul></div>

<div class="card">
  <details id="sc">
    <summary id="scSummary"></summary>
    <ol id="scSteps"></ol>
  </details>
  <details id="auto">
    <summary id="autoSummary"></summary>
    <ol id="autoSteps"></ol>
  </details>
</div>

<div class="card tip" id="tip"></div>

</section>

ress"></li><li>Tap the <b>&#9432;</b> button in the bottom bar &rsaquo; turn on the <b>In Share Sheet</b> switch ① &rsaquo; tap the <b>tick</b> in the top right to save. Then open <b>Photos</b> &rsaquo; pick a photo &rsaquo; <b>Share</b> &rsaquo; <b>AdamDrop</b> (the first time choose <b>Always Allow</b> and allow <b>Local Network</b>).<img class="gimg" src="/guide/buoc7-bang-chia-se.png" alt="In Share Sheet switch"></li>',

  var receiving = false, sharedFiles = [], shareError = false, shareLoading = false, savingAll = false;
  function receiveRender() {
    $('h1').textContent = receiving ? (lang === 'vi' ? 'Nhận từ ' : 'Receive from ') + PC : t('h1', {pc: PC});
    $('status').hidden = receiving;
    $('modeSend').textContent=t('sendMode'); $('modeReceive').textContent=t('receiveMode');
    $('modeSend').className=receiving?'':'on'; $('modeReceive').className=receiving?'on':'';
    $('sendPane').hidden=receiving; $('receivePane').hidden=!receiving;
    $('receiveTitle').textContent=t('receiveMode'); $('refreshShares').textContent=t('refresh');
    $('saveAllFiles').textContent=t('saveAll');
    $('saveAllFiles').disabled=!sharedFiles.length||savingAll;
    $('photosHelp').textContent=t('photosHelp');
    if(!savingAll)$('receiveStatus').textContent=shareError?t('shareError'):(sharedFiles.length?'':t('emptyShares'));
    var signature=JSON.stringify(sharedFiles)+lang;
    if($('receiveQueue').dataset.signature===signature)return;
    $('receiveQueue').dataset.signature=signature; $('receiveQueue').textContent='';
    sharedFiles.forEach(function(f){
      var item=document.createElement('div');item.className='receive-file';
      var name=document.createElement('strong');name.textContent=f.name;item.appendChild(name);
      var size=document.createElement('div');size.className='mini';size.textContent=fmt(f.size);item.appendChild(size);
      var actions=document.createElement('div');actions.className='receive-actions';
      var url='/download?k='+encodeURIComponent(KEY)+'&id='+encodeURIComponent(f.id);
      var files=document.createElement('a');files.className='dl';files.href=url;files.download=f.name;files.textContent=t('filesSave');actions.appendChild(files);
      if(/^(image|video)\//.test(f.mime)){
        var photos=document.createElement('button');photos.type='button';photos.className='dl dl2';photos.textContent=t('photosSave');
        photos.onclick=function(){openViewer(f,url+'&view=1');};actions.appendChild(photos);
      }
      item.appendChild(actions);$('receiveQueue').appendChild(item);
    });
  }
  function receiveLoad(){
    if(shareLoading)return;shareLoading=true;
    fetch('/shares?k='+encodeURIComponent(KEY),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json();})
      .then(function(j){sharedFiles=j.files;shareError=false;receiveRender();})
      .catch(function(){sharedFiles=[];shareError=true;receiveRender();})
      .finally(function(){shareLoading=false;});
  }
  function openViewer(f, url){
    var isVideo=/^video\//.test(f.mime);
    $('vTitle').textContent=f.name;

    if(isVideo){el=document.createElement('video');el.controls=true;el.preload='metadata';el.setAttribute('playsinline','');}
    else{el=document.createElement('img');el.alt=f.name;}
    el.src=url;
    body.appendChild(el);
    $('vHelp').textContent=isVideo?t('vHelpVideo'):t('vHelpPhoto');
    var o=$('vOpen'); o.textContent=t('vOpenOriginal'); o.href=url;
    $('vClose').textContent=t('vClose');
    $('viewer').hidden=false;
  }

  $('vClose').onclick=closeViewer;

  // Tải cả loạt bằng MỘT lần chạm: Safari tải từng tệp vào Tệp (có thể hỏi cho phép tải nhiều tệp).

  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }

      $('list').appendChild(li);
      queue.push({ file: f, li: li, tries: 0 });
      totalBytes += f.size;
      batchCount++;
    }
    $('listCard').style.display = 'block';
    $('overall').style.display = 'block';
    if (!running) { running = true; startedAt = Date.now(); setBusy(true); next(); }
    render(0);
  }

  function render(current) {
    var sent = doneBytes + current;
    var pct = totalBytes ? Math.min(100, sent / totalBytes * 100) : 0;
    $('ovBar').firstElementChild.style.width = pct.toFixed(1) + '%';
    if (running) {
      $('ovText').textContent = t('sending', { i: Math.min(doneCount + failCount + 1, batchCount), n: batchCount });
      var secs = (Date.now() - startedAt) / 1000;
      var speed = secs > 1 ? sent / secs : 0;
      $('ovSub').textContent = fmt(sent) + ' / ' + fmt(totalBytes) + (speed ? ' · ' + fmt(speed) + '/s' : '');
    }
  }

  function sidFor(f) { return (f.name || 'tep') + '|' + f.size + '|' + (f.lastModified || 0); }

  function fileDone(item) {
    doneCount++; doneBytes += item.file.size;
    item.li.className = 'ok'; item.li.querySelector('.st').textContent = '✓';
    var note = item.li.querySelector('.note'); if (note) note.remove();
    render(0); next();
  }

  function fileFail(item) {
    failCount++; doneBytes += item.file.size;
    item.li.className = 'err'; item.li.querySelector('.st').textContent = '✕';
    render(0); next();
  }

  function next() {
    var item = queue.shift();
    if (!item) return finish();
    var f = item.file;
    item.li.className = 'run';
    item.li.querySelector('.st').textContent = '↑';
    var sid = sidFor(f);
    var rq = new XMLHttpRequest();
    rq.open('GET', '/resume?k=' + encodeURIComponent(KEY) + '&sid=' + encodeURIComponent(sid), true);
    rq.onload = function () {
      var got = 0;
      try { var j = JSON.parse(rq.responseText); if (j && j.ok) got = j.got || 0; } catch (e) {}
      if (got >= f.size && f.size > 0) { fileDone(item); return; }
      if (got > 0) {
        var n = document.createElement('span');
        n.className = 'note';
        n.textContent = t('resume', { size: fmt(got) });
        item.li.querySelector('.n').appendChild(n);
      }
      sendFrom(item, sid, got);
    };
    rq.onerror = function () { sendFrom(item, sid, 0); };
    try { rq.send(); } catch (e) { sendFrom(item, sid, 0); }
  }

  function sendFrom(item, sid, off) {
    var f = item.file;
    if (off >= f.size && f.size > 0) { fileDone(item); return; }
    var end = Math.min(off + CHUNK, f.size);
    var blob;
    try { blob = f.slice(off, end); } catch (e) { blob = f; off = 0; }
    var url = '/upload?k=' + encodeURIComponent(KEY) +
              '&name=' + encodeURIComponent(f.name || 'file') +
              '&mtime=' + (f.lastModified || 0) +
              '&sid=' + encodeURIComponent(sid) + '&off=' + off + '&total=' + f.size;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.upload.onprogress = function (e) { if (e.lengthComputable) render(off + e.loaded); };
    var settled = false;
    function again(got) {
      if (settled) return; settled = true;
      item.tries = 0;
      sendFrom(item, sid, got);
    }
    function retryOrFail() {
      if (settled) return; settled = true;
      if (item.tries < 3) {
        item.tries++;
        item.li.querySelector('.st').textContent = '↻';
        setTimeout(function () { sendFrom(item, sid, off); }, 1500);
        return;
      }
      fileFail(item);
    }
    xhr.onload = function () {
      if (settled) return;
      var j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && j) {
        if (j.done) {
          settled = true;
          if (j.name) item.li.querySelector('.n').textContent = j.name;
          fileDone(item);
          return;
        }
        if (j.error === 'offset' || j.error === 'partial') { again(j.got || 0); return; }
        if (j.error === 'cancelled') { settled = true; fileFail(item); return; }
      }
      if (xhr.status === 403) { settled = true; fileFail(item); return; }
      retryOrFail();
    };
    xhr.onerror = retryOrFail; xhr.onabort = retryOrFail; xhr.ontimeout = retryOrFail;
    xhr.send(blob);
  }

  function finish() {
    running = false; setBusy(false);
    $('ovBar').firstElementChild.style.width = '100%';
    if (failCount === 0) {
      $('ovBar').classList.add('done');
      $('ovText').textContent = t('doneOk', { n: doneCount });
      $('status').textContent = t('statusOk');
    } else {
      $('ovText').textContent = t('doneSome', { ok: doneCount, bad: failCount });
      $('status').textContent = t('statusSome');
    }
    $('ovSub').textContent = fmt(totalBytes);
    if (doneCount > 0) {
      var x = new XMLHttpRequest();
      x.open('POST', '/done?k=' + encodeURIComponent(KEY) + '&count=' + doneCount, true);
      try { x.send(); } catch (e) {}
    }
  }

  ['filePhotos', 'fileAny'].forEach(function (id) {
    $(id).addEventListener('change', function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      addFiles(files);
      e.target.value = '';
    });
  });

  window.addEventListener('beforeunload', function (e) { if (running) { e.preventDefault(); e.returnValue = ''; } });

  /* --- phan hoi giao dien sau khi dung lai ngon ngu --- */
  var stableUrl = 'http://' + HOST + ':' + PORT + '/?k=' + encodeURIComponent(KEY);
  var scOrigin = location.origin;

  function wireCopy() {
    wireOne($('scUrl'), $('scCopy'), scOrigin + '/upload?k=' + encodeURIComponent(KEY));
    wireOne($('rcvScUrl'), $('rcvScCopy'), scOrigin + '/list?k=' + encodeURIComponent(KEY));
  }
  function wireOne(inp, btn, value) {
    if (!inp || !btn) return;
    inp.value = value;
    inp.addEventListener('focus', function () { this.select(); });
    btn.addEventListener('click', function () {
      var ok = false;
      inp.focus(); inp.select(); inp.setSelectionRange(0, 9999);
      try { ok = document.execCommand('copy'); } catch (e) {}
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(inp.value).catch(function () {}); ok = true; }
      btn.textContent = ok ? t('copied') : t('copy2');
      setTimeout(function () { btn.textContent = t('copy2'); }, 2000);
    });
  }

  function tipHost() {
    var el = $('tipHost');
    if (!el) return;
    el.innerHTML = t('tipHome');
    if (location.hostname.toLowerCase() !== HOST) {
      el.innerHTML = '';
      var ping = new XMLHttpRequest();
      ping.open('GET', 'http://' + HOST + ':' + PORT + '/ping', true);
      ping.timeout = 4000;
      ping.onload = function () {
        if (ping.status !== 200) return;
        scOrigin = 'http://' + HOST + ':' + PORT;
        wireCopy();
        el.innerHTML = t('tipStable');
        var a = el.querySelector('a');
        if (a) { a.href = stableUrl; a.textContent = t('aStable'); }
      };
      try { ping.send(); } catch (e) {}
    }
  }

  try { lang = localStorage.getItem('adamdrop.lang') || 'en'; } catch (e) { lang = 'en'; }
  applyLang();
})();
</script>
</body>
</html>
